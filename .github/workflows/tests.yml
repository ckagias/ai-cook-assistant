# The whole test suite, on every pull request and every push to main.
#
# - pytest: backend/tests needs only backend/requirements.txt - no API keys (every provider call
#   is faked or served from demo fixtures) and no detection stack (requirements-detect.txt, 1-2.5 GB).
# - node: the client JS suites (backend/tests/*.test.mjs, Node built-ins only - no npm install) and
#   the syntax check of static/js. test_client_js.py drives them, and it skips itself when node is
#   not on PATH - so they run in their own job where Node is guaranteed instead of passing silently.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10: the README's minimum. 3.12: what start.ps1 installs (detection needs 3.11/3.12).
        # 3.14: newest, what the WSL dev venv runs.
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.14"]
        include:
          # start.ps1 runs the app natively on Windows - CRLF checkout, cp1252 by default.
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run pytest
        # test_client_js.py runs in the node job below.
        run: python -m pytest backend/tests --ignore=backend/tests/test_client_js.py -ra

  node:
    name: node (${{ matrix.os }}, Node 24)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Syntax-check static/js and run the .test.mjs suites
        run: python -m pytest backend/tests/test_client_js.py -ra
