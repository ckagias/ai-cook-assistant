<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Βοηθός Μαγειρικής</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <section id="gate">
    <h1>Βοηθός Μαγειρικής</h1>
    <button id="start" data-action="start" data-speak="start">ΞΕΚΙΝΑ</button>
    <p id="gate-error" role="alert" hidden></p>
  </section>

  <div id="app" hidden>
    <div class="vision-col">
      <div class="viewport">
        <video id="video" playsinline muted autoplay></video>
        <!-- Visual demo overlay: boxes + labels. Hidden from screen readers; speech stays the main channel. -->
        <canvas id="overlay" aria-hidden="true"></canvas>
        <div id="busy" hidden>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>

      <div id="detect-panel">
        <div class="detect-bar">
          <button id="detect-toggle" data-action="detect-toggle" data-speak="detect_toggle" aria-pressed="false">Ανίχνευση</button>
          <span id="detect-stats" aria-hidden="true"></span>
        </div>
        <div class="table-scroll">
          <table id="detect-table" aria-hidden="true"></table>
        </div>
      </div>
    </div>

    <div id="status" role="status" aria-live="assertive" aria-atomic="true"></div>

    <div id="controls">
      <!-- Hold to talk: data-hold keeps the long-press description from firing on it. -->
      <button class="talk" data-action="talk" data-speak="talk" data-hold="1" aria-pressed="false">Μίλα</button>
      <button data-action="identify" data-speak="identify">Τι είναι αυτό;</button>
      <button data-action="recipes" data-speak="recipes">Συνταγές</button>
    </div>

    <div id="recipe-list" hidden></div>

    <div id="stepper" hidden>
      <button class="talk" data-action="talk" data-speak="talk" data-hold="1" aria-pressed="false">Μίλα</button>
      <button data-action="check" data-speak="check">Είναι έτοιμο;</button>
      <button data-action="repeat" data-speak="repeat">Επανάλαβε</button>
      <button data-action="next" data-speak="next">Επόμενο</button>
      <button data-action="stop" data-speak="stop">Διακοπή</button>
    </div>

    <div id="clarify" hidden>
      <button data-action="answer-yes" data-speak="answer_yes">Ναι</button>
      <button data-action="answer-no" data-speak="answer_no">Όχι</button>
    </div>

    <footer>
      <span id="timer"></span>
      <span id="debug"></span>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
